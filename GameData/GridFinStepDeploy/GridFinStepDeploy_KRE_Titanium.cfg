// GridFinStepDeploy: Falcon 9-style stepped grid fin deploy for KRE titanium grid fins (Grid Fin S/M/L Titanium).
// Replaces ModuleAnimateGeneric IN PLACE (same module index 0) so KRE's ModuleDeployableAero (DeployModuleIndex = 0) keeps working.
// Default profile from Morgan's CRS-35 webcast capture (1 s resolution, angles visual estimates):
//   0 -> 45 deg in 3 s, hold 3 s; -> 75 deg in 2.5 s, hold 3.5 s; -> 90 deg in 2.5 s arriving at ~9 deg/s, hinge impact: ~0.75 deg rebounds below the stop, decaying, + 15 Hz shiver.
// Total ~15.6 s. Moves use smooth ease-in-out in TRUE hinge degrees (clip easing is inverted via a sampled LUT + closed-loop correction), all fins synchronous (they share the same action group / start time).
// Revert: delete GameData/GridFinStepDeploy (fins go back to the stock 3 s ModuleAnimateGeneric).
@PART[Grid?Fin?S?Titanium|Grid?Fin?M?Titanium|Grid?Fin?L?Titanium]:HAS[@MODULE[ModuleAnimateGeneric]:HAS[#animationName[NewFinsDeploy]]]:FINAL
{
	@MODULE[ModuleAnimateGeneric]:HAS[#animationName[NewFinsDeploy]]
	{
		@name = ModuleGridFinStepDeploy
		-animSpeed = delete
		-actionGUIName = delete
		-startEventGUIName = delete
		-endEventGUIName = delete
		linearizeTransform = Fin       // Pivot/Fin carries the 0->90 deg hinge rotation in NewFinsDeploy
		targetsInDegrees = True
		moveEase = smooth
		STEP
		{
			target = 45
			move = 3.0
			hold = 3
		}
		STEP
		{
			target = 75
			move = 2.5
			hold = 3.5
		}
		STEP
		{
			target = 90
			move = 2.5
			hold = 0
		}
		lockMode = impact          // impact | bounce (old shake) | none
		impactSpeedFactor = 1.5    // arrival speed at the stop = 1.5 x mean speed of the last move (9 deg/s)
		lockRebound = 0.12         // deg per deg/s of impact speed (A~1.0, first rebound ~0.75 deg)
		lockMaxRebound = 1.0
		lockDamping = 0.25
		lockFrequency = 5.5        // Hz
		lockSettle = 1.1           // s, window for the rebound + shiver
		shiverAmplitude = 0.12     // deg
		shiverFrequency = 15       // Hz
		shiverDecay = 0.1          // s time constant
		// old bounce mode values (used only with lockMode = bounce)
		finalApproach = smooth
		lockOvershoot = 2
		lockBounces = 3.5
		lockDecay = 3.5
		retractMode = smooth
		retractDuration = 6
	}
}
